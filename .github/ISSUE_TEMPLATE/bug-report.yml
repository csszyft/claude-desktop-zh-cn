name: 问题反馈
description: 提交使用本项目时遇到的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        这是 csszyft 分支的问题入口，目前只验证 Windows 11 / Claude 4.29.0.0 x64 / 第三方 API 模式 / 简体中文。
        安装步骤：https://github.com/csszyft/claude-desktop-zh-cn/blob/main/docs/windows-overlay.md
        请只附去除隐私的截图和日志片段，不要上传完整配置、令牌或任务内容。

  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      description: 其它环境尚未验证，请在问题描述中说明具体版本
      options:
        - Windows 11
        - 其它 Windows 版本
        - 其它系统（尚未支持）
    validations:
      required: true
      
  - type: dropdown
    id: isnew
    attributes:
      label: 是否使用本仓库的代码
      description: 请在问题描述中提供提交编号；安装中断时不要直接换版本重新运行
      options:
        - 是
        - 否
        - 其他
    validations:
      required: true     

  - type: input
    id: claude_version
    attributes:
      label: Claude Desktop 版本
      description: 请填写完整版本号和架构
      placeholder: 例如 4.29.0.0 x64
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 出错阶段
      options:
        - prepare（准备副本）
        - seed（写入缓存）
        - finish（恢复官方文件）
        - recover（恢复失败安装）
        - 安装完成后使用
        - 卸载缓存
    validations:
      required: true

  - type: dropdown
    id: third_party_api_mode
    attributes:
      label: 是否用的第三方 API 模式
      description: README 提到本项目仅支持 API 使用方式，请说明当前是否启用了第三方模式
      options:
        - 是
        - 否
        - 不确定
    validations:
      required: true

  - type: textarea
    id: problem_description
    attributes:
      label: 问题描述
      description: 请简要描述你遇到的问题
      placeholder: 例如：安装完成后 Claude 无法启动，或界面没有切换成中文
    validations:
      required: true
